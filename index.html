<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雙三角錐幾何圖 - 可拖曳旋轉 + 可編輯標籤</title>
<style>
  body{margin:0;padding:32px 16px;background:#fafaf8;font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;display:flex;flex-direction:column;align-items:center;}
  .wrap{max-width:680px;width:100%;}
  .hint{display:flex;flex-direction:column;gap:4px;margin:0 0 8px;font-size:13px;color:#6b6a64;}
  .hint b{color:#2c2c2a;font-weight:500;}
  svg{width:100%;cursor:grab;touch-action:none;}
  text.t{font-size:14px;fill:#2c2c2a;}
  text.ts{font-size:12px;fill:#6b6a64;}
  text.th{font-size:14px;font-weight:500;fill:#2c2c2a;}
  .editable{cursor:pointer;}
  .editable:hover text{fill:#185FA5;text-decoration:underline;}
  .c-blue{fill:#B5D4F4;stroke:#185FA5;stroke-width:1.8;}
  .c-teal{fill:#9FE1CB;stroke:#0F6E56;stroke-width:1.8;}
  .c-amber{fill:#FAC775;stroke:#854F0B;stroke-width:1.8;}
  .c-gray{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:2.2;stroke-dasharray:5 3;}
</style>
</head>
<body>
<div class="wrap">
  <div class="hint">
    <div><b>拖曳</b>圖形可旋轉角度：<b id="angleOut">15°</b></div>
    <div>點擊任何<b>文字標籤</b>可直接修改內容</div>
  </div>
  <svg id="stage" viewBox="0 0 680 610" role="img">
    <title>可拖曳旋轉、可編輯標籤的雙三角錐幾何圖</title>

    <line x1="390" y1="70" x2="390" y2="530" stroke="#4a4a47" stroke-width="2" stroke-dasharray="6 6" opacity="0.75"/>

    <line id="lineAB" stroke="#7a7873" stroke-width="1.8" stroke-dasharray="7 7"/>
    <line id="lineAF" stroke="#2c2c2a" stroke-width="2.5"/>
    <line id="lineBF" stroke="#2c2c2a" stroke-width="2.5"/>

    <line id="lineTA" x1="390" y1="70" stroke="#2c2c2a" stroke-width="2.2"/>
    <line id="lineTB" x1="390" y1="70" stroke="#2c2c2a" stroke-width="2.2"/>
    <line id="lineTF" x1="390" y1="70" stroke="#2c2c2a" stroke-width="2.2"/>

    <line id="lineBoA" x1="390" y1="530" stroke="#7a7873" stroke-width="2" stroke-dasharray="7 7"/>
    <line id="lineBoB" x1="390" y1="530" stroke="#7a7873" stroke-width="2" stroke-dasharray="7 7"/>
    <line id="lineBoF" x1="390" y1="530" stroke="#7a7873" stroke-width="2" stroke-dasharray="7 7"/>

    <line id="leaderSale" x2="474" y2="252" stroke="#7a7873" stroke-width="1.2" stroke-dasharray="4 4"/>
    <g class="editable" data-key="sale"><text class="ts" x="480" y="256" id="labelSale">銷售</text></g>

    <circle cx="390" cy="70" r="7" class="c-amber"/>
    <g class="editable" data-key="top"><text class="th" x="390" y="42" text-anchor="middle" id="labelTop">市場 / 策略</text></g>

    <circle id="circA" r="7" class="c-blue"/>
    <g class="editable" data-key="a"><text id="textA" class="th" text-anchor="middle">A</text></g>

    <circle id="circB" r="7" class="c-blue"/>
    <g class="editable" data-key="b"><text id="textB" class="th" text-anchor="middle">B</text></g>

    <circle id="circF" r="8" class="c-teal"/>
    <g class="editable" data-key="f"><text id="textF" class="th" text-anchor="middle">家</text></g>

    <circle cx="390" cy="530" r="9" class="c-gray"/>
    <g class="editable" data-key="bottom"><text class="th" x="390" y="565" text-anchor="middle" font-size="16" id="labelBottom">?</text></g>
    <g class="editable" data-key="footnote"><text class="ts" x="390" y="584" text-anchor="middle" id="labelFootnote">動力 · 幸福動力 · 商業模式核心</text></g>
  </svg>
</div>
<script>
(function(){
  var cx=390, cy=300;
  var A0={x:-206,y:-24}, B0={x:206,y:-24}, F0={x:0,y:70};
  var stage=document.getElementById('stage');
  var angleOut=document.getElementById('angleOut');
  var theta=15, dragging=false, startX=0, startTheta=15, moved=false;
  function rot(p,rad){
    var c=Math.cos(rad), s=Math.sin(rad);
    return {x:p.x*c-p.y*s, y:p.x*s+p.y*c};
  }
  function update(t){
    theta=Math.max(-10,Math.min(50,t));
    var rad=theta*Math.PI/180;
    var A=rot(A0,rad), B=rot(B0,rad), F=rot(F0,rad);
    A={x:cx+A.x,y:cy+A.y}; B={x:cx+B.x,y:cy+B.y}; F={x:cx+F.x,y:cy+F.y};
    document.getElementById('lineAB').setAttribute('x1',A.x);document.getElementById('lineAB').setAttribute('y1',A.y);
    document.getElementById('lineAB').setAttribute('x2',B.x);document.getElementById('lineAB').setAttribute('y2',B.y);
    document.getElementById('lineAF').setAttribute('x1',A.x);document.getElementById('lineAF').setAttribute('y1',A.y);
    document.getElementById('lineAF').setAttribute('x2',F.x);document.getElementById('lineAF').setAttribute('y2',F.y);
    document.getElementById('lineBF').setAttribute('x1',B.x);document.getElementById('lineBF').setAttribute('y1',B.y);
    document.getElementById('lineBF').setAttribute('x2',F.x);document.getElementById('lineBF').setAttribute('y2',F.y);
    document.getElementById('lineTA').setAttribute('x2',A.x);document.getElementById('lineTA').setAttribute('y2',A.y);
    document.getElementById('lineTB').setAttribute('x2',B.x);document.getElementById('lineTB').setAttribute('y2',B.y);
    document.getElementById('lineTF').setAttribute('x2',F.x);document.getElementById('lineTF').setAttribute('y2',F.y);
    document.getElementById('lineBoA').setAttribute('x2',A.x);document.getElementById('lineBoA').setAttribute('y2',A.y);
    document.getElementById('lineBoB').setAttribute('x2',B.x);document.getElementById('lineBoB').setAttribute('y2',B.y);
    document.getElementById('lineBoF').setAttribute('x2',F.x);document.getElementById('lineBoF').setAttribute('y2',F.y);
    document.getElementById('circA').setAttribute('cx',A.x);document.getElementById('circA').setAttribute('cy',A.y);
    document.getElementById('circB').setAttribute('cx',B.x);document.getElementById('circB').setAttribute('cy',B.y);
    document.getElementById('circF').setAttribute('cx',F.x);document.getElementById('circF').setAttribute('cy',F.y);
    document.getElementById('textA').setAttribute('x',A.x-33);document.getElementById('textA').setAttribute('y',A.y-19);
    document.getElementById('textB').setAttribute('x',B.x+27);document.getElementById('textB').setAttribute('y',B.y+22);
    document.getElementById('textF').setAttribute('x',F.x+40);document.getElementById('textF').setAttribute('y',F.y+24);
    var mid={x:(A.x+B.x)/2,y:(A.y+B.y)/2};
    document.getElementById('leaderSale').setAttribute('x1',mid.x);document.getElementById('leaderSale').setAttribute('y1',mid.y);
    angleOut.textContent=Math.round(theta)+'°';
  }
  stage.addEventListener('pointerdown',function(e){
    if(e.target.closest('.editable'))return;
    dragging=true; startX=e.clientX; startTheta=theta; moved=false;
    stage.setPointerCapture(e.pointerId); stage.style.cursor='grabbing';
  });
  stage.addEventListener('pointermove',function(e){
    if(!dragging)return;
    var rect=stage.getBoundingClientRect();
    var scale=680/rect.width;
    var dx=(e.clientX-startX)*scale;
    if(Math.abs(dx)>2)moved=true;
    update(startTheta+dx*0.18);
  });
  function endDrag(e){ dragging=false; stage.style.cursor='grab'; }
  stage.addEventListener('pointerup',endDrag);
  stage.addEventListener('pointercancel',endDrag);
  update(theta);

  var labelIds={a:'textA',b:'textB',f:'textF',top:'labelTop',bottom:'labelBottom',sale:'labelSale',footnote:'labelFootnote'};
  document.querySelectorAll('.editable').forEach(function(g){
    g.addEventListener('click',function(e){
      e.stopPropagation();
      var key=g.getAttribute('data-key');
      var el=document.getElementById(labelIds[key]);
      var current=el.textContent;
      var next=window.prompt('修改標籤內容：',current);
      if(next!==null && next.trim()!==''){ el.textContent=next.trim(); }
    });
  });
})();
</script>
</body>
</html>
